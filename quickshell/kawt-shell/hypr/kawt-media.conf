# kawt-shell: the media keys through kawt, for the classic hyprland.conf (optional).
# The osd shows at once and kawt doesn't have to poll the brightness.
#
# Remove your own XF86 binds first (both would fire), then add to ~/.config/hypr/hyprland.conf,
# after the line that loads kawt.conf:
#   source = ~/.config/quickshell/kawt-shell/hypr/kawt-media.conf
# (with hyprland.lua: kawt.media_keys(), see hypr/kawt.lua)

$kawt = qs -c kawt-shell ipc call kawt

bindel = , XF86AudioRaiseVolume, exec, $kawt volume up
bindel = , XF86AudioLowerVolume, exec, $kawt volume down
bindl = , XF86AudioMute, exec, $kawt volume mute
bindl = , XF86AudioMicMute, exec, $kawt mic mute
bindel = , XF86MonBrightnessUp, exec, $kawt brightness up
bindel = , XF86MonBrightnessDown, exec, $kawt brightness down
bindl = , XF86AudioPlay, exec, $kawt media toggle
bindl = , XF86AudioPause, exec, $kawt media toggle
bindl = , XF86AudioNext, exec, $kawt media next
bindl = , XF86AudioPrev, exec, $kawt media prev
