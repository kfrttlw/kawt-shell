# kawt-shell for Hyprland with the classic hyprland.conf (before 0.55 / no hyprland.lua).
#
# install: add to ~/.config/hypr/hyprland.conf
#   source = ~/.config/quickshell/kawt-shell/hypr/kawt.conf
#
# Nothing has to be changed in this file (an update would stop at a change here). After that
# line, in your own hyprland.conf:
#   unbind = SUPER, H     frees one of the keys below, for a bind of your own
#   source = ~/.config/quickshell/kawt-shell/hypr/kawt-media.conf
#                         the volume, brightness and player keys through kawt

$kawt = qs -c kawt-shell ipc call kawt

# kept running: started again if it crashes
exec-once = sh ~/.config/quickshell/kawt-shell/scripts/keep.sh
# the password window for apps that need admin rights (hyprpolkitagent; not installed: nothing)
exec-once = systemctl --user start hyprpolkitagent

bind = SUPER, SPACE, exec, $kawt toggle launcher
bind = SUPER, R, exec, $kawt run
bind = SUPER SHIFT, V, exec, $kawt clipboard
bind = SUPER, D, exec, $kawt toggle menu
bind = SUPER, A, exec, $kawt sidebar
bind = SUPER ALT, A, exec, $kawt selection
bind = SUPER ALT, V, exec, $kawt voice
bind = SUPER, W, exec, $kawt toggle style
bind = SUPER SHIFT, W, exec, $kawt toggleLight
bind = SUPER, N, exec, $kawt toggle notifs
bind = SUPER SHIFT, N, exec, $kawt dnd
bind = SUPER, I, exec, $kawt toggle today
bind = SUPER, comma, exec, $kawt toggle settings
bind = SUPER, L, exec, $kawt lock
bind = SUPER, Escape, exec, $kawt toggle power
bind = SUPER, slash, exec, $kawt toggle keys
bind = SUPER SHIFT, B, exec, $kawt bar toggle
bind = SUPER, H, exec, $kawt companion call
bind = , Print, exec, $kawt screenshot region
bind = SUPER SHIFT, S, exec, $kawt screenshot region
bind = SHIFT, Print, exec, $kawt screenshot screen
bind = ALT, Print, exec, $kawt screenshot window
bind = SUPER SHIFT, R, exec, $kawt record region
bind = SUPER ALT, R, exec, $kawt record screen

# media keys through kawt (optional): hypr/kawt-media.conf, sourced from your own config

# square windows, like the bar
decoration {
    rounding = 0
}
misc {
    allow_session_lock_restore = true
    # the screen off after the lock (settings -> screen and lock): a key or the mouse brings it back
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# border colors of the current kawt theme (a theme switch also sets them at once, with hyprctl keyword)
source = ~/.local/state/kawt/theme/hyprland.conf
