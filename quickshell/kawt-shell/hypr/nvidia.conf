# NVIDIA for Hyprland with the classic hyprland.conf: only on a machine that draws with an nvidia
# card alone (not a hybrid laptop: there the intel / amd gpu draws).
#
# install: the installer adds this line to ~/.config/hypr/hyprland.conf when you say yes to it
#   source = ~/.config/quickshell/kawt-shell/hypr/nvidia.conf # kawt: nvidia

# videos decoded on the gpu (libva-nvidia-driver): firefox, mpv
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
# OpenGL through nvidia's own library (screen sharing in discord / zoom broken: remove this line)
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
