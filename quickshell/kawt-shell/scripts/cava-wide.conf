; kawt: cava while the player popover is open (services/Cava.qml): its spectrum, 24 bars of 0..8,
; 30 frames a second. The bar's five come from these then, so only one cava runs either way.

[general]
bars = 24
framerate = 30
autosens = 1
sleep_timer = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 8
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
