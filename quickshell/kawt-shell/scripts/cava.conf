; kawt: cava for the bar's media button (services/Cava.qml).
; Prints the levels as plain numbers instead of drawing: five bars of 0..7, one line per frame,
; 20 frames a second. Cheap for cava, and the bar redraws only that often.

[general]
bars = 5
framerate = 20
autosens = 1
; a second of silence (paused stream) and cava sleeps instead of sending zeros
sleep_timer = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
; ";" between bars, newline after each frame
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
