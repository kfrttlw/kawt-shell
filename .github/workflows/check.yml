# The checks that need no Hyprland: run on every push.
# The same by hand, before a commit: python3 tools/check.py (and shellcheck, if you have it)
name: check

# on every push, to any branch: a pull request from a branch here shows these same checks, so
# running them again for it only doubled them
on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # what stops the shell from loading: imports, a property set twice, javascript too new
      # for qt, a FINAL property, kawt's words in both languages (tools/check.py says more)
      - name: qml and words
        run: python3 tools/check.py

      # bash -n takes one file: the rest would be its arguments
      - name: shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            if head -n 1 "$f" | grep -q '^#!/bin/sh'; then sh -n "$f"; else bash -n "$f"; fi || exit 1
          done

      - name: shellcheck
        run: shellcheck -S warning $(git ls-files '*.sh')

      # the cursor files in the repo are what tools/cursors.py draws (drawn again after a change)
      - name: cursors
        run: python3 tools/cursors.py --check

      # a mistake in kawt.lua isn't loud: hyprland skips the file (pcall) and kawt's keys are gone
      - name: lua syntax
        run: |
          # the runner's package list can be stale and its mirror can miss a moment: fresh, and again
          for i in 1 2 3; do
            sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq --no-install-recommends lua5.4 > /dev/null && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          for f in $(git ls-files '*.lua'); do luac5.4 -p "$f" || exit 1; done

  # the shell really loaded: quickshell in an arch container, kawt in a headless sway, every
  # panel, window and page opened over ipc; what qt says didn't load fails it (tools/load-test.sh)
  load:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 40
    steps:
      - name: packages
        run: |
          pacman -Syu --noconfirm --needed git sway dbus ttf-dejavu wl-clipboard > /dev/null
          # arch's sway carries a file capability (realtime priority), which a container won't run:
          # a plain copy of it, first in PATH
          install -m 755 /usr/bin/sway /usr/local/bin/sway
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester

      # from the repos if they have it, built from the aur if not
      - name: quickshell
        run: |
          if pacman -Si quickshell > /dev/null 2>&1; then
            pacman -S --noconfirm quickshell > /dev/null
          else
            sudo -u tester bash -c 'cd ~ && git clone -q --depth 1 https://aur.archlinux.org/quickshell.git && cd quickshell && makepkg -si --noconfirm --needed > build.log 2>&1 || { tail -n 60 build.log; exit 1; }'
          fi
          qs --version

      - uses: actions/checkout@v5

      - name: kawt loads
        run: |
          chown -R tester: "$GITHUB_WORKSPACE"
          sudo -u tester tools/load-test.sh

