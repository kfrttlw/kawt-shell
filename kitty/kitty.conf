# kawt / kitty
# An old terminal, but crisp: solid background, block cursor, no rounded anything.
# Colors come from the current kawt theme and switch with it.

include ~/.local/state/kawt/theme/kitty.conf

# --- font ------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
modify_font      cell_height 108%
disable_ligatures cursor

# --- window ----------------------------------------------------------------
background_opacity     1.0
hide_window_decorations yes
window_padding_width   10
confirm_os_window_close 0
remember_window_size   no
initial_window_width   100c
initial_window_height  30c

# --- cursor: a blinking block, like a real terminal --------------------------
cursor_shape               block
cursor_blink_interval      0.5
cursor_stop_blinking_after 0

# --- scrollback / text -----------------------------------------------------
scrollback_lines      10000
url_style             straight
detect_urls           yes
copy_on_select        no
strip_trailing_spaces smart

# --- bell: a short flash instead of a beep ---------------------------------
enable_audio_bell    no
visual_bell_duration 0.08

# --- tabs: [1:zsh]  2:nvim   at the bottom, only when there is more than one
tab_bar_edge              bottom
tab_bar_style             separator
tab_separator             " "
tab_bar_min_tabs          2
tab_title_max_length      24
tab_title_template        " {index}:{title} "
active_tab_title_template "[{index}:{title}]"
active_tab_font_style     bold
inactive_tab_font_style   normal

shell_integration enabled

# --- keys ------------------------------------------------------------------
# new windows/tabs open in the current directory
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
